<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="নিংশিং চে - বিষ্ণুপ্রিয়া মণিপুরি তথ্যকোষ" />
    <meta property="og:description" content="ইমার ঠারে বিষ্ণুপ্রিয়া মণিপুরি সাহিত্য, সংস্কৃতি, ইতিহাস চর্চার অনলাইন প্লাটফর্ম নিংশিং চে" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="নিংশিং চে" />
    <meta property="og:url" content="https://ningshingche.com/" />
    <meta property="og:image" content="https://surajit-singha-sisir.github.io/NingshingCheNew/NingshingChe-Logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="https://surajit-singha-sisir.github.io/NingshingCheNew/NingshingChe-Logo.png" />

    <!-- Mekholi typeface (loaded from the Mekholi-Fonts project; @font-face rules are in src/styles/base.css) -->
    <link rel="preconnect" href="https://sisir-sinha.github.io" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://sisir-sinha.github.io/Mekholi-Fonts/mekholi-family/fonts/web/Mekholi-Regular.woff2" />
    <link rel="preconnect" href="https://blogger.googleusercontent.com" crossorigin />
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Set the theme before first paint (no flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nc-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">মূল লেখায় যান</a>
    <div id="progress" aria-hidden="true"></div>

    <main id="main" tabindex="-1">
      <!-- placeholder shown until the script starts; the router replaces it -->
      <div class="container section sk-stack" aria-hidden="true">
        <span class="sk sk--hero"></span>
        <span class="sk sk--title" style="width: 40%"></span>
        <span class="sk sk--line"></span>
        <span class="sk sk--line" style="width: 85%"></span>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <div id="overlays"></div>
    <noscript><p style="padding:2rem;text-align:center">এই সাইটটি দেখতে JavaScript চালু করুন।</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
